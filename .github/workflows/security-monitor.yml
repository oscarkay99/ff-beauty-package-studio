name: Live security baseline

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-security-baseline
  cancel-in-progress: true

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify live security baseline
        run: ./scripts/security-check.sh https://ffbeauty1.com
